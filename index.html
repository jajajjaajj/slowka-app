<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Słówka EN/PL</title>

  <!-- PWA basics -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; padding: 16px; max-width: 720px; }
    h1 { font-size: 20px; margin: 8px 0 16px; }
    .card { border: 1px solid #ddd; border-radius: 14px; padding: 14px; margin: 12px 0; }
    .row { display:flex; gap:10px; flex-wrap: wrap; align-items: center; }
    button, select, input[type="text"] { font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid #ccc; }
    button { cursor:pointer; }
    .big { font-size: 22px; font-weight: 700; }
    .muted { color:#666; }
    .ok { color: #0a7; font-weight: 700; }
    .bad { color: #c22; font-weight: 700; }
    .spacer { height: 6px; }
    .full { width: 100%; }
    .hint { font-size: 14px; color:#666; margin-top: 6px; }
    .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background:#f3f3f3; padding:2px 6px; border-radius:8px; }
    .pill { display:inline-block; padding:3px 10px; border-radius:999px; border:1px solid #ddd; font-size: 13px; color:#444; }
  </style>
</head>
<body>
  <h1>📚 Słówka EN/PL (tryb powtórek aż do skutku)</h1>

  <div class="card">
    <div class="row">
      <input id="file" type="file" accept=".csv,.txt" />
      <button id="loadSample">Wczytaj przykładową listę</button>
      <button id="clear">Wyczyść listę</button>
    </div>
    <div class="hint">
      Format: <span class="kbd">angielski,polski</span> (CSV) albo <span class="kbd">angielski;polski</span> lub <span class="kbd">angielski\tpolski</span>.
      Jedna para na linię.
    </div>
    <div class="spacer"></div>
    <div class="row">
      <label>Tryb:
        <select id="mode">
          <option value="pl-en">PL → EN</option>
          <option value="en-pl">EN → PL</option>
        </select>
      </label>
      <label>Losowo:
        <select id="shuffle">
          <option value="yes">Tak</option>
          <option value="no">Nie</option>
        </select>
      </label>
      <button id="start">Start / Reset</button>
    </div>
    <div class="muted" id="stats">Brak wczytanych słówek.</div>
  </div>

  <div class="card" id="quizCard" style="display:none;">
    <div class="row" style="justify-content: space-between;">
      <div class="muted" id="progress"></div>
      <div class="pill" id="roundInfo" title="Po zakończeniu rundy wracają tylko błędne słówka">Runda: 1</div>
    </div>

    <div class="spacer"></div>
    <div class="big" id="prompt"></div>
    <div class="spacer"></div>

    <input class="full" id="answer" type="text" placeholder="Wpisz tłumaczenie..." autocomplete="off" />
    <div class="spacer"></div>

    <div class="row">
      <button id="check">Sprawdź</button>
      <button id="dontKnow">Nie wiem</button>
      <button id="show">Pokaż odpowiedź</button>
      <button id="next">Następne</button>
    </div>

    <div class="spacer"></div>
    <div id="feedback" class="muted"></div>
  </div>

<script>
(() => {
  const els = {
    file: document.getElementById('file'),
    loadSample: document.getElementById('loadSample'),
    clear: document.getElementById('clear'),
    mode: document.getElementById('mode'),
    shuffle: document.getElementById('shuffle'),
    start: document.getElementById('start'),
    stats: document.getElementById('stats'),
    quizCard: document.getElementById('quizCard'),
    progress: document.getElementById('progress'),
    roundInfo: document.getElementById('roundInfo'),
    prompt: document.getElementById('prompt'),
    answer: document.getElementById('answer'),
    check: document.getElementById('check'),
    dontKnow: document.getElementById('dontKnow'),
    show: document.getElementById('show'),
    next: document.getElementById('next'),
    feedback: document.getElementById('feedback'),
  };

  let pairs = [];              // {en, pl}
  let order = [];              // indices in current round
  let idx = 0;                 // position in current round
  let round = 1;               // round number
  let wrongSet = new Set();    // indices answered wrong in current round
  let checkedThisCard = false; // whether this question was already evaluated (so wrong not double-counted)

  const STORAGE_KEY = "slownika_pairs_v2";

  function normalize(s) {
    return (s ?? "")
      .toString()
      .trim()
      .toLowerCase()
      .replace(/\s+/g, " ");
  }

  function parseLines(text) {
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const out = [];

    for (const lineRaw of lines) {
      const line = lineRaw.replace(/\uFEFF/g, "").trim(); // remove BOM if present
      let parts;

      if (line.includes("\t")) parts = line.split("\t");
      else if (line.includes(";")) parts = line.split(";");
      else if (line.includes(",")) parts = line.split(",");
      else if (line.includes(" - ")) parts = line.split(" - ");
      else if (line.includes(" = ")) parts = line.split(" = ");
      else if (line.includes("=")) parts = line.split("=");
      else if (line.includes("–")) parts = line.split("–");
      else if (line.includes("—")) parts = line.split("—");
      else if (line.includes("-")) parts = line.split("-");
      else continue;

      if (!parts || parts.length < 2) continue;

      const left = (parts[0] ?? "").trim();
      const right = (parts.slice(1).join(parts[1]?.includes(",") ? "," : " ").trim());
      if (!left || !right) continue;

      // assume left=en right=pl
      out.push({ en: left, pl: right });
    }

    return out;
  }

  function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(pairs));
  }
  function loadFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed.filter(x => x && x.en && x.pl);
    } catch { return []; }
  }

  function updateStats() {
    els.stats.textContent = pairs.length
      ? `Wczytane słówka: ${pairs.length}. (Błędne wracają w kolejnych rundach aż je opanujesz.)`
      : "Brak wczytanych słówek.";
  }

  function shuffleArray(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
  }

  function makeOrderFromAll() {
    order = pairs.map((_, i) => i);
    if (els.shuffle.value === "yes") shuffleArray(order);
  }

  function makeOrderFromWrong() {
    order = Array.from(wrongSet);
    if (els.shuffle.value === "yes") shuffleArray(order);
  }

  function currentQA() {
    const p = pairs[order[idx]];
    const mode = els.mode.value;
    if (mode === "pl-en") return { prompt: p.pl, expected: p.en };
    return { prompt: p.en, expected: p.pl };
  }

  function updateHeader() {
    els.roundInfo.textContent = `Runda: ${round}`;
    els.progress.textContent = `Pytanie ${idx + 1} / ${order.length} • Do powtórki w tej rundzie: ${wrongSet.size}`;
  }

  function render() {
    if (!pairs.length) {
      els.quizCard.style.display = "none";
      updateStats();
      return;
    }
    if (!order.length) {
      // nothing to show (shouldn't happen unless list empty)
      els.quizCard.style.display = "none";
      return;
    }

    els.quizCard.style.display = "block";
    const { prompt } = currentQA();
    els.prompt.textContent = prompt;
    els.answer.value = "";
    els.answer.focus();
    els.feedback.textContent = "";
    checkedThisCard = false;
    updateHeader();
  }

  function resetQuiz() {
    if (!pairs.length) return;
    round = 1;
    wrongSet = new Set();
    idx = 0;
    makeOrderFromAll();
    render();
  }

  function markWrongOnce() {
    if (checkedThisCard) return;
    wrongSet.add(order[idx]);
    checkedThisCard = true;
    updateHeader();
  }

  function markChecked() {
    if (checkedThisCard) return;
    checkedThisCard = true;
    updateHeader();
  }

  function checkAnswer() {
    if (!pairs.length) return;
    const { expected } = currentQA();
    const user = normalize(els.answer.value);
    const exp = normalize(expected);

    if (!user) {
      els.feedback.innerHTML = `<span class="bad">Wpisz odpowiedź</span> albo kliknij <b>Nie wiem</b>.`;
      return;
    }

    if (user === exp) {
      els.feedback.innerHTML = `<span class="ok">Dobrze!</span> ✅`;
      markChecked();
    } else {
      els.feedback.innerHTML = `<span class="bad">Źle.</span> Poprawnie: <b>${expected}</b>`;
      markWrongOnce();
    }
  }

  function dontKnow() {
    if (!pairs.length) return;
    const { expected } = currentQA();
    els.feedback.innerHTML = `<span class="bad">OK, wróci później.</span> Poprawnie: <b>${expected}</b>`;
    markWrongOnce();
  }

  function showAnswer() {
    if (!pairs.length) return;
    const { expected } = currentQA();
    els.feedback.innerHTML = `Odpowiedź: <b>${expected}</b>`;
    // Samo "pokaż" nie liczy jako błąd, ale też nie zalicza jako dobrze.
    // Jeśli chcesz, żeby samo "Pokaż" też wrzucało do powtórek, odkomentuj linię:
    // markWrongOnce();
  }

  function finishRoundOrNext() {
    if (!pairs.length) return;

    idx++;

    if (idx < order.length) {
      render();
      return;
    }

    // End of this round
    if (wrongSet.size === 0) {
      els.feedback.innerHTML = `<b>🎉 Brawo!</b> Wszystko opanowane w tej sesji. Kliknij <b>Start / Reset</b>, żeby zacząć od nowa.`;
      // keep last card visible
      idx = order.length - 1;
      updateHeader();
      return;
    }

    // Start next round with wrong-only
    round++;
    idx = 0;
    makeOrderFromWrong();

    // reset wrongSet for new round (we will refill it with still-wrong)
    wrongSet = new Set();

    els.feedback.innerHTML = `<b>Runda ${round}</b>: teraz tylko te słówka, które były błędne.`;
    // short delay so user sees message, then render next
    setTimeout(render, 250);
  }

  // Events
  els.file.addEventListener("change", async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;

    // Force UTF-8 decoding (fix PL characters)
    const buffer = await f.arrayBuffer();
    const decoder = new TextDecoder("utf-8");
    const text = decoder.decode(buffer);

    const parsed = parseLines(text);
    if (!parsed.length) {
      alert("Nie udało się wczytać. Sprawdź format: angielski,polski (jedna para na linię).");
      return;
    }
    pairs = parsed;
    saveToStorage();
    updateStats();
    resetQuiz();
  });

  els.loadSample.addEventListener("click", () => {
    const sample = `apple,jabłko
to improve,poprawiać
take a break,zrobić przerwę
certainly,z pewnością
environment,środowisko`;
    pairs = parseLines(sample);
    saveToStorage();
    updateStats();
    resetQuiz();
  });

  els.clear.addEventListener("click", () => {
    pairs = [];
    localStorage.removeItem(STORAGE_KEY);
    updateStats();
    els.quizCard.style.display = "none";
  });

  els.start.addEventListener("click", resetQuiz);
  els.check.addEventListener("click", checkAnswer);
  els.dontKnow.addEventListener("click", dontKnow);
  els.show.addEventListener("click", showAnswer);
  els.next.addEventListener("click", finishRoundOrNext);

  els.answer.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      checkAnswer();
    }
  });

  // Load persisted list
  pairs = loadFromStorage();
  updateStats();
  if (pairs.length) resetQuiz();
})();
</script>
</body>
</html>
