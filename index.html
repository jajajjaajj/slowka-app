<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Słówka EN/PL</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; padding: 16px; max-width: 760px; }
    h1 { font-size: 20px; margin: 8px 0 16px; }
    .card { border: 1px solid #ddd; border-radius: 14px; padding: 14px; margin: 12px 0; }
    .row { display:flex; gap:10px; flex-wrap: wrap; align-items: center; }
    button, select, input[type="text"], input[type="number"] { font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid #ccc; }
    button { cursor:pointer; }
    .big { font-size: 22px; font-weight: 700; }
    .muted { color:#666; }
    .ok { color: #0a7; font-weight: 700; }
    .bad { color: #c22; font-weight: 700; }
    .spacer { height: 6px; }
    .full { width: 100%; }
    .hint { font-size: 14px; color:#666; margin-top: 6px; }
    .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background:#f3f3f3; padding:2px 6px; border-radius:8px; }
    .pill { display:inline-block; padding:3px 10px; border-radius:999px; border:1px solid #ddd; font-size: 13px; color:#444; }
  </style>
</head>
<body>
  <h1>📚 Słówka EN/PL (grupy po 15 + powtórki do skutku)</h1>

  <div class="card">
    <div class="row">
      <input id="file" type="file" accept=".csv,.txt" />
      <button id="loadSample">Wczytaj przykładową listę</button>
      <button id="clear">Wyczyść listę</button>
    </div>

    <div class="hint">
      Format: <span class="kbd">EN,PL</span> albo <span class="kbd">EN;PL</span> / <span class="kbd">EN\tPL</span>. Jedna para na linię.
    </div>

    <div class="spacer"></div>

    <div class="row">
      <label>Tryb:
        <select id="mode">
          <option value="pl-en">PL → EN</option>
          <option value="en-pl">EN → PL</option>
        </select>
      </label>

      <label>Losowo w grupie:
        <select id="shuffle">
          <option value="yes">Tak</option>
          <option value="no">Nie</option>
        </select>
      </label>

      <label>Wielkość grupy:
        <input id="groupSize" type="number" min="5" max="100" value="15" style="width:90px;">
      </label>

      <button id="start">Start / Reset</button>
    </div>

    <div class="muted" id="stats">Brak wczytanych słówek.</div>
  </div>

  <div class="card" id="quizCard" style="display:none;">
    <div class="row" style="justify-content: space-between;">
      <div class="muted" id="progress"></div>
      <div class="pill" id="groupInfo">Grupa 1</div>
    </div>

    <div class="spacer"></div>
    <div class="big" id="prompt"></div>
    <div class="spacer"></div>

    <input class="full" id="answer" type="text" placeholder="Wpisz tłumaczenie..." autocomplete="off" />
    <div class="spacer"></div>

    <div class="row">
      <button id="check">Sprawdź</button>
      <button id="dontKnow">Nie wiem</button>
      <button id="show">Pokaż</button>
      <button id="next">Następne</button>
    </div>

    <div class="spacer"></div>
    <div id="feedback" class="muted"></div>
  </div>

<script>
(() => {
  const els = {
    file: document.getElementById('file'),
    loadSample: document.getElementById('loadSample'),
    clear: document.getElementById('clear'),
    mode: document.getElementById('mode'),
    shuffle: document.getElementById('shuffle'),
    groupSize: document.getElementById('groupSize'),
    start: document.getElementById('start'),
    stats: document.getElementById('stats'),
    quizCard: document.getElementById('quizCard'),
    progress: document.getElementById('progress'),
    groupInfo: document.getElementById('groupInfo'),
    prompt: document.getElementById('prompt'),
    answer: document.getElementById('answer'),
    check: document.getElementById('check'),
    dontKnow: document.getElementById('dontKnow'),
    show: document.getElementById('show'),
    next: document.getElementById('next'),
    feedback: document.getElementById('feedback'),
  };

  // ===== Data =====
  let pairs = []; // {en,pl}
  const STORAGE_KEY = "slownika_pairs_groups_v1";

  // ===== Group state =====
  let groupSize = 15;
  let groupIndex = 0;          // 0-based index of group in whole list
  let groupIndices = [];       // indices (into pairs) belonging to current group
  let roundIndices = [];       // indices (into pairs) for current round within group
  let idx = 0;                 // pointer in roundIndices
  let wrongSet = new Set();    // wrong in current round
  let checkedThisCard = false; // avoid double-marking
  let totalGroups = 0;

  function normalize(s) {
    return (s ?? "").toString().trim().toLowerCase().replace(/\s+/g, " ");
  }

  function parseLines(text) {
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const out = [];
    for (const lineRaw of lines) {
      const line = lineRaw.replace(/\uFEFF/g, "").trim(); // remove BOM if present
      let parts;

      if (line.includes("\t")) parts = line.split("\t");
      else if (line.includes(";")) parts = line.split(";");
      else if (line.includes(",")) parts = line.split(",");
      else if (line.includes(" → ")) parts = line.split(" → ");
      else if (line.includes("→")) parts = line.split("→");
      else if (line.includes(" = ")) parts = line.split(" = ");
      else if (line.includes("=")) parts = line.split("=");
      else if (line.includes(" - ")) parts = line.split(" - ");
      else if (line.includes("–")) parts = line.split("–");
      else if (line.includes("—")) parts = line.split("—");
      else if (line.includes("-")) parts = line.split("-");
      else continue;

      if (!parts || parts.length < 2) continue;

      const en = (parts[0] ?? "").trim();
      const pl = (parts.slice(1).join(parts.includes(",") ? "," : " ").trim());
      if (en && pl) out.push({ en, pl });
    }
    return out;
  }

  function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(pairs));
  }
  function loadFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed.filter(x => x && x.en && x.pl);
    } catch { return []; }
  }

  function updateStats() {
    els.stats.textContent = pairs.length
      ? `Wczytane słówka: ${pairs.length}. Grupy po ${groupSize}.`
      : "Brak wczytanych słówek.";
  }

  function shuffleArray(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
  }

  function currentQA() {
    const p = pairs[roundIndices[idx]];
    if (els.mode.value === "pl-en") return { prompt: p.pl, expected: p.en };
    return { prompt: p.en, expected: p.pl };
  }

  function updateHeader() {
    els.groupInfo.textContent = `Grupa ${groupIndex + 1} / ${totalGroups}`;
    els.progress.textContent = `W tej rundzie: ${idx + 1} / ${roundIndices.length} • Do powtórki w grupie: ${wrongSet.size}`;
  }

  function render() {
    if (!pairs.length || !roundIndices.length) {
      els.quizCard.style.display = "none";
      return;
    }
    els.quizCard.style.display = "block";

    const { prompt } = currentQA();
    els.prompt.textContent = prompt;
    els.answer.value = "";
    els.answer.focus();
    els.feedback.textContent = "";
    checkedThisCard = false;
    updateHeader();
  }

  function startGroup(gIndex) {
    groupIndex = gIndex;

    // build indices for this group
    const start = groupIndex * groupSize;
    const end = Math.min(start + groupSize, pairs.length);
    groupIndices = [];
    for (let i = start; i < end; i++) groupIndices.push(i);

    // first round = whole group
    roundIndices = groupIndices.slice();
    if (els.shuffle.value === "yes") shuffleArray(roundIndices);

    idx = 0;
    wrongSet = new Set();
    render();
  }

  function resetAll() {
    if (!pairs.length) return;

    groupSize = Math.max(5, Math.min(100, parseInt(els.groupSize.value || "15", 10) || 15));
    els.groupSize.value = groupSize;

    totalGroups = Math.ceil(pairs.length / groupSize);
    updateStats();

    startGroup(0);
  }

  function markWrongOnce() {
    if (checkedThisCard) return;
    wrongSet.add(roundIndices[idx]);
    checkedThisCard = true;
    updateHeader();
  }

  function markChecked() {
    if (checkedThisCard) return;
    checkedThisCard = true;
    updateHeader();
  }

  function checkAnswer() {
    const { expected } = currentQA();
    const user = normalize(els.answer.value);
    const exp = normalize(expected);

    if (!user) {
      els.feedback.innerHTML = `<span class="bad">Wpisz odpowiedź</span> albo kliknij <b>Nie wiem</b>.`;
      return;
    }

    if (user === exp) {
      els.feedback.innerHTML = `<span class="ok">Dobrze!</span> ✅`;
      markChecked();
    } else {
      els.feedback.innerHTML = `<span class="bad">Źle.</span> Poprawnie: <b>${expected}</b>`;
      markWrongOnce();
    }
  }

  function dontKnow() {
    const { expected } = currentQA();
    els.feedback.innerHTML = `<span class="bad">OK, wróci w powtórkach.</span> Poprawnie: <b>${expected}</b>`;
    markWrongOnce();
  }

  function showAnswer() {
    const { expected } = currentQA();
    els.feedback.innerHTML = `Odpowiedź: <b>${expected}</b>`;
  }

  function next() {
    idx++;

    // still within current round
    if (idx < roundIndices.length) {
      render();
      return;
    }

    // end of round inside group
    if (wrongSet.size > 0) {
      // next round = only wrong ones, repeat until wrongSet becomes empty
      roundIndices = Array.from(wrongSet);
      if (els.shuffle.value === "yes") shuffleArray(roundIndices);
      wrongSet = new Set();
      idx = 0;
      els.feedback.innerHTML = `<b>Powtórka w grupie:</b> teraz tylko te, które były błędne.`;
      setTimeout(render, 250);
      return;
    }

    // group mastered -> go to next group
    if (groupIndex + 1 < totalGroups) {
      const nextGroup = groupIndex + 1;
      els.feedback.innerHTML = `<b>✅ Grupa opanowana!</b> Przechodzę do grupy ${nextGroup + 1} / ${totalGroups}.`;
      setTimeout(() => startGroup(nextGroup), 350);
      return;
    }

    // all done
    els.feedback.innerHTML = `<b>🎉 Brawo!</b> Wszystkie słówka z całej bazy są opanowane. Kliknij <b>Start / Reset</b>, żeby zacząć od nowa.`;
    idx = roundIndices.length - 1;
    updateHeader();
  }

  // ===== Events =====
  els.file.addEventListener("change", async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;

    // Force UTF-8 decoding for Polish characters
    const buffer = await f.arrayBuffer();
    const decoder = new TextDecoder("utf-8");
    const text = decoder.decode(buffer);

    const parsed = parseLines(text);
    if (!parsed.length) {
      alert("Nie udało się wczytać. Sprawdź format: EN,PL (jedna para na linię).");
      return;
    }

    pairs = parsed;
    saveToStorage();

    groupSize = Math.max(5, Math.min(100, parseInt(els.groupSize.value || "15", 10) || 15));
    totalGroups = Math.ceil(pairs.length / groupSize);
    updateStats();

    startGroup(0);
  });

  els.loadSample.addEventListener("click", () => {
    const sample = `apple,jabłko
to improve,poprawiać
take a break,zrobić przerwę
certainly,z pewnością
environment,środowisko
rigidity,sztywność
bearing surfaces,powierzchnie nośne
probe,sonda
clogging,zatykanie
plunger,tłok
narrow,wąski
absorption,pochłanianie
layout,plan
consist,składać się
retractable,chowany`;
    pairs = parseLines(sample);
    saveToStorage();
    resetAll();
  });

  els.clear.addEventListener("click", () => {
    pairs = [];
    localStorage.removeItem(STORAGE_KEY);
    updateStats();
    els.quizCard.style.display = "none";
  });

  els.start.addEventListener("click", resetAll);
  els.check.addEventListener("click", checkAnswer);
  els.dontKnow.addEventListener("click", dontKnow);
  els.show.addEventListener("click", showAnswer);
  els.next.addEventListener("click", next);

  els.answer.addEventListener("keydown", (e) => {
    if (e.key === "Enter") checkAnswer();
  });

  // ===== Init =====
  pairs = loadFromStorage();
  groupSize = Math.max(5, Math.min(100, parseInt(els.groupSize.value || "15", 10) || 15));
  totalGroups = pairs.length ? Math.ceil(pairs.length / groupSize) : 0;
  updateStats();
  if (pairs.length) startGroup(0);
})();
</script>
</body>
</html>
